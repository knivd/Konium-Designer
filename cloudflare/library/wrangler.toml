# Konium's world parts library: parts published by designers, kept in a public Git repository and
# given to the public domain (CC0 1.0), reached at https://konium.app/api/library. The GitHub token,
# the library's secret and the mail key are secrets (npx.cmd wrangler secret put …), never in this file.
name = "konium-library"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# The service itself, and the library's public pages (one for each part, their list and their sitemap)
routes = [
  { pattern = "konium.app/api/library/*", zone_name = "konium.app" },
  { pattern = "konium.app/parts", zone_name = "konium.app" },
  { pattern = "konium.app/parts/*", zone_name = "konium.app" },
]

# One Durable Object (SQLite) for the counts, the sign-ins under way, the contributors and the parts' index
[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"

[[durable_objects.bindings]]
name = "ORGS"
class_name = "Org"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Store"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Org"]

# The sign-in mail goes by Cloudflare's own Email Service (Workers Paid; konium.app is set up for
# sending). This binding may send from the library's address and no other. Without the binding the
# mail would go by Resend, with the secret RESEND_KEY.
[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["library@konium.app"]

[vars]
# The public repository the parts are kept in ("owner/name") and its branch
LIBRARY_REPO = ""
LIBRARY_BRANCH = "main"
# The sign-in mail's sender (an address on the site's domain, verified with whoever sends the mail)
MAIL_FROM = "library@konium.app"
MAIL_NAME = "Konium parts library"
# Where the mailed link leads
SITE = "https://konium.app"
# For each user (by IP address): parts fetched a day, sign-in links asked for an hour, parts published a day
FETCH_PER_DAY = "500"
SIGNIN_PER_HOUR = "5"
PUBLISH_PER_DAY = "20"
CHECK_PER_DAY = "40"
# Public pages made a day for one visitor (a page asked for again within five minutes is not made again)
PAGE_PER_DAY = "2000"
# Company libraries: the domains that may have one ("*" for any; "" for none), how many parts each holds, how old a sign-in may be
ORG_DOMAINS = ""
ORG_PARTS = "200"
ORG_SESSION_DAYS = "30"

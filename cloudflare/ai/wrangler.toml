# Konium's AI service: Preferences › System › AI › Konium service posts its jobs to
# https://konium.app/api/ai. The OpenRouter key and the salt are secrets (npx.cmd wrangler secret put …),
# never in this file.
name = "konium-ai"
main = "src/index.ts"
compatibility_date = "2025-09-01"

routes = [{ pattern = "konium.app/api/ai/*", zone_name = "konium.app" }]

# One Durable Object (SQLite) for the day's counts, the day's spend and the shared cache
[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Store"]

[vars]
# Jobs a day for each user (by IP address); a datasheet's survey is one job
JOBS_PER_DAY = "25"
# The whole service's spend a day, US dollars (OpenRouter's credit limit on the key is the monthly cap)
DAILY_BUDGET_USD = "1.00"
# The automatic model choice: OpenRouter's "latest" aliases (~vendor/family-latest, each always its
# family's newest) of the families offered, taking pictures; its price ceiling, US dollars per million
# tokens; and the default (an alias, offered whatever its family and price; a model's id stands for its
# family's alias; empty: the first, the cheapest). One model does every job. A survey costs about $0.03–0.25, a
# footprint $0.02–0.20 (more with its checks).
FAMILIES = "anthropic/claude-opus, openai/gpt-sol, google/gemini-pro, google/gemini-flash"
MAX_PRICE_IN = "10"
MAX_PRICE_OUT = "50"
DEFAULT_MODEL = "~google/gemini-flash-latest"
# The cheap text model for plain text jobs (a specification's requirements); empty: qwen/qwen3.8-flash. Its family's newest once retired.
CHEAP_MODEL = ""
# The models offered, if not the automatic choice, e.g.
# MODELS = '[{"id": "google/gemini-3.1-flash-lite", "label": "Gemini 3.1 Flash-Lite", "roles": ["text", "vision"]}]'
MODELS = ""

<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <!-- No script written into an attribute (onerror=, onclick=) runs on this page: Konium has none of its own, so one could only have come in with a file -->
  <meta http-equiv="Content-Security-Policy" content="script-src-attr 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#13201d" />
  <!-- The app's page (konium.app/app/). What search engines and link previews read is the website's, at konium.app/ -->
  <meta name="description" content="Konium Designer, free schematic capture and PCB layout in the browser. This is the program itself; its website is konium.app." />
  <meta name="robots" content="noindex" />
  <title>Konium Designer</title>
  <!-- The icon inline, so it shows when the page is opened straight from disk -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='m' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23186553'/%3E%3Cstop offset='1' stop-color='%230a2c25'/%3E%3C/linearGradient%3E%3ClinearGradient id='c' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23f6d47a'/%3E%3Cstop offset='1' stop-color='%23d4972a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='1' y='1' width='62' height='62' rx='14' fill='url(%23m)'/%3E%3Crect x='1.75' y='1.75' width='60.5' height='60.5' rx='13.25' fill='none' stroke='%23ffffff' stroke-opacity='.14' stroke-width='1.5'/%3E%3Cpath d='M24 16V48M24 32L40 16M24 32L40 48' fill='none' stroke='url(%23c)' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='24' cy='16' r='6.5' fill='url(%23c)'/%3E%3Ccircle cx='24' cy='16' r='2.8' fill='%230a2c25'/%3E%3Ccircle cx='24' cy='32' r='6.5' fill='url(%23c)'/%3E%3Ccircle cx='24' cy='32' r='2.8' fill='%230a2c25'/%3E%3Ccircle cx='24' cy='48' r='6.5' fill='url(%23c)'/%3E%3Ccircle cx='24' cy='48' r='2.8' fill='%230a2c25'/%3E%3Ccircle cx='40' cy='16' r='6.5' fill='url(%23c)'/%3E%3Ccircle cx='40' cy='16' r='2.8' fill='%230a2c25'/%3E%3Ccircle cx='40' cy='48' r='6.5' fill='url(%23c)'/%3E%3Ccircle cx='40' cy='48' r='2.8' fill='%230a2c25'/%3E%3C/svg%3E" />
  <style>
    #boot { font: 14px/1.5 system-ui, sans-serif; color: #e6eae3; background: #0f1a17; min-height: 100vh; margin: 0; display: grid; justify-items: center; }
    #boot > div { max-width: 760px; padding: 32px 24px; }
    #boot .boot-status { color: #d2b04c; font-weight: 600; }
    #boot .boot-site, #boot .boot-dev { font-size: 12px; color: #9aa59e; }
    #boot a { color: #d2b04c; }
    #boot code { color: #d2b04c; }
    #boot pre { white-space: pre-wrap; color: #e5484d; font-size: 12px; }
    .no-boot #boot { background: #c0c0c0; }
    .no-boot #boot > div > :not(#boot-error) { display: none; }
  </style>
  <script>
    // Shown until the app mounts. If the bundle fails to load or throws, the reason appears here.
    // (Preferences › System › General › Show startup screen off: a plain screen, errors still shown)
    try { if (/"showStartupScreen":false/.test(localStorage.getItem('konium.settings.v2') || '')) document.documentElement.className += ' no-boot'; } catch (e) { /* storage refused */ }
    window.__bootErrors = [];
    window.addEventListener('error', function (e) {
      if (e.target && e.target.src && e.target.src.indexOf('umami') >= 0) return; // visit counting blocked or offline: not the app's problem
      var msg = e.message || (e.target && (e.target.src || e.target.href) ? 'Failed to load ' + (e.target.src || e.target.href) : 'Unknown error');
      window.__bootErrors.push(msg);
      var pre = document.getElementById('boot-error');
      if (pre) { pre.textContent = window.__bootErrors.join('\n'); }
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      window.__bootErrors.push(String(e.reason && e.reason.stack || e.reason));
      var pre = document.getElementById('boot-error');
      if (pre) { pre.textContent = window.__bootErrors.join('\n'); }
    });
  </script>
</head>
<body style="margin:0">
  <div id="app">
    <div id="boot"><div>
      <p class="boot-status">Konium Designer is starting…</p>
      <noscript><p>Konium Designer runs in your browser and needs JavaScript.</p></noscript>
      <pre id="boot-error"></pre>
      <p class="boot-site">About Konium Designer, its downloads and What's New: <a href="https://konium.app/">konium.app</a></p>
      <p class="boot-dev">Opened the source file? It only runs through the dev server: run <code>npm install</code> then <code>npm run dev</code>, or open the built <code>dist/app/index.html</code>.</p>
    </div></div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
